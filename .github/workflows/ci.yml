name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l internal cmd)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: compiler builds
        run: go build ./...

  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: version consistency
        run: bun run version:check

      - name: typecheck
        run: bun run typecheck

      - name: runtime and plugin tests
        run: bun test packages/runtime/test packages/vite-plugin/test

  packages:
    name: npm package contents
    needs: [go, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: every package documents itself
        run: |
          missing=0
          for dir in packages/*/; do
            if [ ! -f "${dir}README.md" ]; then
              echo "::error file=${dir}package.json::${dir} has no README.md"
              missing=1
            fi
          done
          if [ ! -f packages/cli/README.md ]; then
            echoing "flexui-compiler needs its README"
            missing=1
          fi
          exit $missing

      - name: build binaries and checksums
        run: bash scripts/build-binaries.sh

      - name: build TypeScript output
        run: |
          bun run build:js
          bun run build:runtime
          bun run build:integrations

      - name: binaries report the version.json version
        run: |
          expected="$(go run ./cmd/version -field version)"
          actual="$(./packages/cli-linux-x64/flexui version)"
          echo "expected: $expected"
          echo "actual:   $actual"
          case "$actual" in
            *"$expected"*) ;;
            *) echo "binary version does not match version.json"; exit 1 ;;
          esac

      - name: tarballs are publishable
        run: bun run publish:npm:dry-run
