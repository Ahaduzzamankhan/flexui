name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Resolve or create release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: create tag for manual dispatch or validate pushed tag
        id: tag
        run: |
          expected="$(bun scripts/version.ts tag)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$expected"
            git fetch --tags origin
            existing="$(git rev-parse -q --verify "refs/tags/$tag" || true)"
            if [ -n "$existing" ]; then
              echo "Tag $tag already exists; reusing it without moving or recreating it."
            else
              git tag "$tag"
              git push origin "$tag"
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "$expected" ]; then
              echo "Refusing to release: pushed tag $tag does not match version.json ($expected)."
              exit 1
            fi
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

  verify:
    name: Verify tag and tests
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.release_tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: version consistency
        run: bun run version:check

      - run: go vet ./...
      - run: go test ./...
      - run: bun run typecheck
      - run: bun test packages/runtime/test packages/vite-plugin/test

  release:
    name: Build binaries and publish release
    needs: [tag, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.release_tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: build binaries
        run: bash scripts/build-binaries.sh

      - name: write release notes from CHANGELOG.md
        run: bun scripts/version.ts notes --out dist-release/RELEASE_NOTES.md

      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          shopt -s nullglob

          binaries=(
            packages/cli-win32-*/flexui.exe
            packages/cli-linux-*/flexui
            packages/cli-darwin-*/flexui
          )

          if [ "${#binaries[@]}" -eq 0 ]; then
            echo "No compiled binaries found after build-binaries.sh." >&2
            find packages -maxdepth 3 -type f -print
            exit 1
          fi

          printf 'Found %s compiled binaries.\n' "${#binaries[@]}"
          sha256sum "${binaries[@]}" > dist-release/SHA256SUMS
          test -s packages/cli/checksums.json
          test -s dist-release/RELEASE_NOTES.md

      - name: create or update GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.release_tag }}"
          asset_dir="dist-release/assets"
          mkdir -p "$asset_dir"

          # GitHub Release asset names must be unique. Give every platform
          # binary a stable OS/architecture-specific filename.
          for source in packages/cli-win32-x64/flexui.exe; do
            [ -f "$source" ] && cp "$source" "$asset_dir/flexui-windows-x64.exe"
          done
          for source in packages/cli-win32-arm64/flexui.exe; do
            [ -f "$source" ] && cp "$source" "$asset_dir/flexui-windows-arm64.exe"
          done
          for source in packages/cli-linux-x64/flexui; do
            [ -f "$source" ] && cp "$source" "$asset_dir/flexui-linux-x64"
          done
          for source in packages/cli-linux-arm64/flexui; do
            [ -f "$source" ] && cp "$source" "$asset_dir/flexui-linux-arm64"
          done
          for source in packages/cli-darwin-x64/flexui; do
            [ -f "$source" ] && cp "$source" "$asset_dir/flexui-macos-x64"
          done
          for source in packages/cli-darwin-arm64/flexui; do
            [ -f "$source" ] && cp "$source" "$asset_dir/flexui-macos-arm64"
          done

          cp packages/cli/checksums.json "$asset_dir/checksums.json"
          cp dist-release/SHA256SUMS "$asset_dir/SHA256SUMS"

          shopt -s nullglob
          assets=("$asset_dir"/*)
          if [ "${#assets[@]}" -ne 8 ]; then
            echo "Expected 6 platform binaries and 2 checksum files; found ${#assets[@]} assets." >&2
            ls -la "$asset_dir"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating existing release $tag."
            gh release edit "$tag" \
              --title "FlexUI ${tag#v}" \
              --notes-file dist-release/RELEASE_NOTES.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --title "FlexUI ${tag#v}" \
              --notes-file dist-release/RELEASE_NOTES.md \
              "${assets[@]}"
          fi

  npm:
    name: Publish npm packages
    needs: [tag, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing exchanges this for a short-lived npm credential and
      # attaches provenance to every tarball.
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: use a current npm CLI
        run: npm install --global npm@^11.15.0

      - name: choose the npm credential
        id: auth
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: no npm credential configured
        if: steps.auth.outputs.mode == 'none'
        run: echo "Neither NPM_TOKEN nor OIDC is available; the GitHub release was created without npm packages."

      - name: install
        if: steps.auth.outputs.mode != 'none'
        run: bun install --frozen-lockfile

      - name: version consistency
        if: steps.auth.outputs.mode != 'none'
        run: bun run version:check

      - name: build binaries and checksums
        if: steps.auth.outputs.mode != 'none'
        run: bash scripts/build-binaries.sh

      - name: build TypeScript output
        if: steps.auth.outputs.mode != 'none'
        run: |
          bun run build:js
          bun run build:runtime
          bun run build:integrations

      - name: publish straight to the registry
        if: steps.auth.outputs.mode != 'none'
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          if [ "$AUTH_MODE" = "oidc" ]; then
            unset NODE_AUTH_TOKEN
            echo "Publishing with trusted publishing (OIDC); provenance is generated automatically."
          else
            echo "Publishing with the configured NPM_TOKEN."
          fi
          # publish.ts publishes every package in dependency order with plain
          # npm publish and the dist-tag from version.json. It never calls
          # npm stage publish, so versions go live as soon as npm accepts them.
          bun scripts/publish.ts
