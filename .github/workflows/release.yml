name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: tag matches version.json
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="$(bun scripts/version.ts tag)"
          echo "tag: $tag"
          echo "version.json: $expected"
          if [ "$tag" != "$expected" ]; then
            echo "Refusing to release: the pushed tag does not match version.json."
            exit 1
          fi

      - name: version consistency
        run: bun run version:check

      - run: go vet ./...
      - run: go test ./...
      - run: bun run typecheck
      - run: bun test packages/runtime/test packages/vite-plugin/test

  release:
    name: Build binaries and publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: build binaries with the version.json version
        run: bash scripts/build-binaries.sh

      - name: stage assets, notes and checksums
        run: bun scripts/release.ts --skip-build

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(bun scripts/version.ts tag)"
          gh release create "$tag" \
            --title "FlexUI ${tag#v}" \
            --notes-file dist-release/RELEASE_NOTES.md \
            dist-release/assets/* \
            dist-release/SHA256SUMS

  npm:
    name: Publish npm packages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing exchanges this for a short-lived npm credential and
      # attaches provenance to every tarball.
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm stage publish introduced a review queue; direct publishing needs a
      # CLI that understands both OIDC and plain npm publish.
      - name: use a current npm CLI
        run: npm install --global npm@^11.15.0

      - name: choose the npm credential
        id: auth
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: no npm credential configured
        if: steps.auth.outputs.mode == 'none'
        run: echo "Neither NPM_TOKEN nor OIDC is available; the GitHub release was created without npm packages."

      - name: install
        if: steps.auth.outputs.mode != 'none'
        run: bun install --frozen-lockfile

      - name: version consistency
        if: steps.auth.outputs.mode != 'none'
        run: bun run version:check

      - name: build binaries and checksums
        if: steps.auth.outputs.mode != 'none'
        run: bash scripts/build-binaries.sh

      - name: build TypeScript output
        if: steps.auth.outputs.mode != 'none'
        run: |
          bun run build:js
          bun run build:runtime
          bun run build:integrations

      - name: publish straight to the registry
        if: steps.auth.outputs.mode != 'none'
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          if [ "$AUTH_MODE" = "oidc" ]; then
            unset NODE_AUTH_TOKEN
            echo "Publishing with trusted publishing (OIDC); provenance is generated automatically."
          else
            echo "Publishing with the configured NPM_TOKEN."
          fi
          # publish.ts runs plain npm publish for every package in dependency
          # order. It never calls npm stage publish, so versions go live as soon
          # as npm accepts them instead of waiting in the staging queue.
          bun scripts/publish.ts
