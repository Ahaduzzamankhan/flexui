name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Resolve or create release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: create tag for manual dispatch or validate pushed tag
        id: tag
        run: |
          expected="$(bun scripts/version.ts tag)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$expected"
            git fetch --tags origin
            existing="$(git rev-parse -q --verify "refs/tags/$tag" || true)"
            if [ -n "$existing" ]; then
              echo "Tag $tag already exists; reusing it without moving or recreating it."
            else
              git tag "$tag"
              git push origin "$tag"
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "$expected" ]; then
              echo "Refusing to release: pushed tag $tag does not match version.json ($expected)."
              exit 1
            fi
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

  verify:
    name: Verify tag and tests
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.release_tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: version consistency
        run: bun run version:check

      - run: go vet ./...
      - run: go test ./...
      - run: bun run typecheck
      - run: bun test packages/runtime/test packages/vite-plugin/test

  release:
    name: Build binaries and publish release
    needs: [tag, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.release_tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: build binaries
        run: bash scripts/build-binaries.sh

      - name: write release notes from CHANGELOG.md
        run: bun scripts/version.ts notes --out dist-release/RELEASE_NOTES.md

      - name: checksums
        run: |
          mkdir -p dist-release
          bun scripts/release.ts --skip-build > dist-release/release-log.txt
          cat dist-release/release-log.txt

      - name: create or update GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.tag.outputs.release_tag }}"
          assets=(
            packages/cli-*/flexui
            packages/cli-*/flexui.exe
            packages/cli/checksums.json
            dist-release/SHA256SUMS
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating notes and replacing matching assets."
            gh release edit "$tag" \
              --title "FlexUI ${tag#v}" \
              --notes-file dist-release/RELEASE_NOTES.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --title "FlexUI ${tag#v}" \
              --notes-file dist-release/RELEASE_NOTES.md \
              "${assets[@]}"
          fi

  npm:
    name: Publish npm packages
    needs: [tag, release]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - if: env.NPM_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.release_tag }}

      - if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - if: env.NPM_TOKEN != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - if: env.NPM_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: env.NPM_TOKEN != ''
        run: bun install --frozen-lockfile
      - if: env.NPM_TOKEN != ''
        run: bash scripts/build-binaries.sh
      - if: env.NPM_TOKEN != ''
        run: bun run build:js
      - if: env.NPM_TOKEN != ''
        run: bun run build:runtime
      - if: env.NPM_TOKEN != ''
        run: bun run build:integrations

      - name: publish platform packages first
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/cli-*/; do
            npm publish "$dir" --access public --ignore-scripts
          done

      - name: publish runtime and integrations
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish packages/runtime --access public --ignore-scripts
          npm publish packages/react --access public --ignore-scripts
          npm publish packages/vue --access public --ignore-scripts
          npm publish packages/svelte --access public --ignore-scripts
          npm publish packages/vite-plugin --access public --ignore-scripts

      - name: publish the CLI last
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish packages/cli --access public --ignore-scripts
